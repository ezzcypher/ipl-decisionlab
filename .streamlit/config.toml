[theme]
base = "dark"
primaryColor = "#7c6cff"
backgroundColor = "#0b1020"
secondaryBackgroundColor = "#18223a"
textColor = "#e8ecf5"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = true

[server]
headless = true
maxUploadSize = 5  # MB; the only upload is a small auction-price CSV

[browser]
gatherUsageStats = false
